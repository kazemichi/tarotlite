<!DOCTYPE html>
<html>
    <head>
        <base href="https://cdn.jsdelivr.net/gh/kazemichi/tarotlite/">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>TaRoTLiTe</title>
        <link rel="icon" href="images/moon.svg" type="image/svg+xml" />
        <link rel="preload" href="fonts/SamigirianSerif/SamigirianSerif-Regular.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="stylesheet" href="styles/main.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@callmebill/lxgw-wenkai-web@latest/lxgwwenkai-regular/result.css" />
        <script src="scripts/background.js" defer></script>
        <script src="scripts/load_data.js" defer></script>
        <script src="scripts/card_reveal.js" defer></script>
        <script src="scripts/draw_card.js" defer></script>
        <script src="scripts/card_tilt.js" defer></script>
    </head>
    <body>
        <!-- 星轨背景 -->
        <div class="background">
            <canvas id="startrail" aria-hidden="true"></canvas>
        </div>

        <!-- 展示内容 -->
        <main class="stage">
            <button class="draw-btn">REVEAL YOUR CARD ¬</button>

            <section id="cardStack" class="card-stack hidden">
                <!-- 左侧: 卡牌图片 -->
                <div class="card-left">
                    <img class="card-img" alt="Tarot Card" draggable="false" />
                    <canvas id="revealCanvas" aria-hidden="true"></canvas>
                    <canvas id="sparkOverlay" aria-hidden="true"></canvas>
                </div>
                <!-- 右侧: 信息面板 -->
                <div class="card-right">
                    <header class="card-title">
                        <span class="card-name"></span>
                        <span class="card-pos"></span>
                    </header>

                    <div class="card-attrs">
                        <div class="attr-item"><span class="label"></span><span class="val"></span></div>
                        <div class="attr-item"><span class="label"></span><span class="val"></span></div>
                        <div class="attr-item"><span class="label"></span><span class="val"></span></div>
                        <div class="attr-item"><span class="label"></span><span class="val"></span></div>
                        <div class="attr-item"><span class="label"></span><span class="val"></span></div>
                        <div class="attr-item"><span class="label"></span><span class="val"></span></div>
                    </div>

                    <div class="keyword-block">
                        <div class="upright"></div>
                        <div class="reversed"></div>
                    </div>

                    <div class="meaning-block">
                        <h4></h4>
                        <p class="meaning-text"></p>
                    </div>
                </div>
            </section>

            <footer class="page-footer">
                <span>the stars whisper, the cards speak.</span>
            </footer>
        </main>
    </body>
</html>
